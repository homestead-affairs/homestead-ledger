name: ci
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: {}

# `fetch-depth: 0` on every checkout is not optional now: the version is derived
# from the git tag (hatch-vcs, pyproject `dynamic = ["version"]`), and the
# default shallow checkout carries no tags — `pip install -e .` would then build
# a mislabelled version. The cold-checkout posture is unchanged; full history is
# a read, not an install step. Mirrors the engine's `homestead/.github/workflows/ci.yml`.

jobs:
  invariants:
    # A cold checkout, nothing but pytest, bare `pytest -q` — the same posture as
    # the engine's CI and homestead-law's. The engine (homestead.keep) ships on
    # PyPI as `homestead-affairs`, so `pip install -e .` resolves it from the
    # index like any dependency — no cross-repo checkout.
    #
    # test_invariants_release.py importorskips PyYAML, which is not installed
    # here — it runs in the `release-wiring` leg below, which has the dev extra.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install pytest
      - run: pip install -e .        # pulls homestead-affairs (homestead.keep) from PyPI

      - name: pytest
        run: pytest -q

      - name: smoke-run the module headless
        run: python -m homestead_ledger --smoke

  release-wiring:
    # The release chain is four files that must agree, and every disagreement is
    # silent (tests/test_invariants_release.py). That test reads the workflows
    # with PyYAML, so it needs the dev extra — without it the check would *skip*,
    # which is the exact silent failure it exists to catch. One leg, dev extra,
    # so the invariants job above stays cold.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_invariants_release.py

  artifact:
    # bite 3's deliverable is a *double-clickable artifact*, so CI builds it
    # and runs it. Without this job a spec that dies on startup (imports
    # missing from the PyInstaller bundle, an entry point that moved) stays
    # green here while every other test passes — mirrors the engine's own
    # `artifact` job (`homestead/.github/workflows/ci.yml`).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install pyinstaller .   # pulls homestead-affairs (homestead.keep) from PyPI
      - run: pyinstaller --clean --noconfirm packaging/homestead-ledger.spec

      - name: smoke-run the built artifact
        shell: bash
        run: |
          BIN=dist/HomesteadLedger
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          "$BIN" --smoke

  # Aggregate gate: branch protection requires a single check named "test", and
  # release-please.yml's auto-merge waits on it. Green only when every leg is.
  #
  # `if: always()` is load-bearing, not boilerplate. Without it, a failing
  # dependency does not fail this job — it *skips* it, because that is what
  # `needs:` means. A skipped required check does not block a merge, so the one
  # check branch protection trusts would go quiet at exactly the moment it
  # mattered. The result is asserted explicitly rather than inferred from this
  # job having run.
  test:
    needs: [invariants, release-wiring, artifact]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every dependency actually succeeded
        # 'skipped' and 'cancelled' are failures here too: a leg that did not run
        # has told us nothing, and this gate speaks for all of them.
        if: ${{ contains(needs.*.result, 'failure')
                || contains(needs.*.result, 'cancelled')
                || contains(needs.*.result, 'skipped') }}
        run: |
          echo "invariants=${{ needs.invariants.result }}"
          echo "release-wiring=${{ needs.release-wiring.result }}"
          echo "artifact=${{ needs.artifact.result }}"
          echo "::error::a required job did not succeed — see the results above"
          exit 1

      - run: echo "invariants, release-wiring, and the artifact build are green"
