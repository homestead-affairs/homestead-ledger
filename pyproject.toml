[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
# Distribution name, NOT the import name. `import homestead_ledger` is
# unchanged (see [tool.hatch.build.targets.wheel] below) — this is only what
# you `pip install`. Unlike the engine, `homestead-ledger` is free on PyPI
# (confirmed 404 on /pypi/homestead-ledger/json), so no split is needed here —
# distribution and import names differ only by the hyphen/underscore PyPI
# already normalises.
name = "homestead-ledger"
# The git tag is the single source of truth — see [tool.hatch.version]. The
# version is deliberately NOT a literal here, mirroring the engine: a number
# nothing derives is a number that goes stale. hatch-vcs derives it from the
# tag instead, so there is exactly one place a release number is decided.
dynamic = ["version"]
description = "Homestead · Affairs — module two. The household's own books, local-first on SQLite, 'mirror not judge'."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["ledger", "money", "local-first", "sqlite", "self-represented", "legal-aid", "homestead"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business",
]

# Module two of the Homestead · Affairs face — the homesteader keeping their own
# books. **Mirror, not judge:** the app reflects the household's money and never
# authors a financial judgment or edits a transaction (the engine's I-6/I-25 for
# money). Self-contained and local-first: the store is embedded SQLite in the
# shared `/.homestead` root it shares with homestead-law, no server, no port.
#
# It pins the engine `homestead.keep` from PyPI as the distribution
# **homestead-affairs** (the bare `homestead` name on PyPI is an unrelated
# abandoned package); `import homestead` / `from homestead.keep...` is unchanged
# — the scikit-learn/sklearn split. Floor 0.1.0 is the first version this module
# actually needs — where the shared `homestead.app.theme` landed and this view
# began drawing from it. The `<1.0` cap means "every compatible version": the
# engine's release config (bump-minor-pre-major false) bumps the minor for a
# feat — so 0.2, 0.3, … all resolve under `<1.0` with no re-pin — and reserves
# 1.0.0 for the first breaking change. The cap only asks to be revisited when
# compatibility actually breaks (see the engine's release-please-config.json,
# and jeles' note there on why `<1.0` must mean something).
#
# sqlite3 is stdlib — no dependency line for the store. holidays arrives through
# homestead.keep (its deadline arithmetic), declared there, not re-declared here.
dependencies = ["homestead-affairs>=0.1.0,<1.0"]

[project.optional-dependencies]
# `pyyaml` and `tomli` are for tests/test_invariants_release.py, which reads the
# release workflows and pyproject to check the four release files agree. It
# importorskips on yaml, so leaving pyyaml out would turn those checks into a
# silent skip — the exact failure mode they exist to catch. Dev-only, so the
# runtime `dependencies` list above is untouched.
dev = ["pytest>=8.0", "pyyaml", "tomli; python_version<'3.11'"]
entity = ["nestor-meaning>=0.11.0,<1.0"]

[project.scripts]
homestead-ledger = "homestead_ledger.__main__:main"

[project.urls]
Homepage = "https://github.com/homestead-affairs/homestead-ledger"
Repository = "https://github.com/homestead-affairs/homestead-ledger"
Issues = "https://github.com/homestead-affairs/homestead-ledger/issues"
Changelog = "https://github.com/homestead-affairs/homestead-ledger/blob/main/CHANGELOG.md"

[tool.hatch.version]
# Derived from the git tag (hatch-vcs). At an exact tag `vX.Y.Z` the version is
# X.Y.Z; off-tag builds get a `.devN+g<sha>` suffix that PyPI rejects, so an
# accidental publish from an untagged commit fails loudly instead of shipping
# something mislabelled. CI must check out with `fetch-depth: 0` — the default
# shallow checkout carries no tags and the derived version would be wrong.
#
# No tag exists yet: this repo has never published. `.release-please-manifest.json`
# anchors the current version at 0.0.1 (what the code already called itself), and
# release-please cuts the first real tag from the commits (`release-type: simple`,
# release-please-config.json) rather than anyone tagging by hand — PyPI never lets
# a version be reused.
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["homestead_ledger"]

[tool.pytest.ini_options]
# Bare `pytest -q` must work. Nothing shadows the live suite.
testpaths = ["tests"]
norecursedirs = ["_archived", "build", "dist", ".git", "packaging"]
